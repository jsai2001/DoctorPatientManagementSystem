version: '3'
services:
  www:
    image: php:apache
    volumes:
      - "./DoctorPatientManagementSystem/:/var/www/html" # sync project dir with container web dir
    ports:
      - 80:80
      - 443:443 # for future ssl traffic
  db:
    image: mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_ALLOW_EMPTY_PASSWORD=1 # equivalent to True
    volumes:
      - "./DoctorPatientManagementSystem/init_db_structure/:/docker-entrypoint-initdb.d" # sync persistent sql files with the container
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - 8001:80
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306